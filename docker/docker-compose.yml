version: '3.8'

services:
  forecastos:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: forecastos_app
    ports:
      - "8000:8000"
    environment:
      - TIMESFM_MOCK=true
      - EVM_ENABLED=false
      - DATABASE_URL=sqlite:///./forecastos.db
    volumes:
      - forecastos_data:/app
    restart: unless-stopped

volumes:
  forecastos_data:
